name: Update RMG Database Data

on:
  schedule:
    # Run every week on Sunday at 2:00 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sqlalchemy pandas numpy

      - name: Run data update script
        run: |
          python scripts/fetch_latest_rmg_data.py

      - name: Build databases
        run: |
          ./build.sh

      - name: Check for changes
        id: changes
        run: |
          git diff --exit-code || echo "CHANGES=true" >> $GITHUB_ENV

      - name: Commit and push changes
        if: env.CHANGES == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update RMG database data [skip ci]"
          git push origin main

      - name: Create Pull Request (if needed)
        if: env.CHANGES == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update RMG database data"
          title: "Update RMG database data"
          body: "Automated update of RMG database data from the official repository."
          branch: "update-rmg-data"