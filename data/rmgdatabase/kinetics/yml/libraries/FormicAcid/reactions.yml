label: OH + CO <=> OCHO
short_description: '[Nguyen2012]'
long_description: "\n    Calculated based on the HEAT (High-accuracy Extrapolated\
  \ Ab initio Thermochemistry) protocol, specifically the HEAT-345Q variant, as detailed\
  \ in [Nguyen2012].\n    T range: 50-2500 K; calculations focus on the zero- and\
  \ high-pressure limits.This calculation explicitly accounts for quantum mechanical\
  \ tunneling effects using semiclassical transition state theory (SCTST), which incorporates\
  \ fully coupled vibrations and multidimensional tunneling.   \n    "
kinetics:
  type: Chebyshev
  Tmin:
  - 300.0
  - K
  Tmax:
  - 3000.0
  - K
  Pmin:
  - 0.01
  - bar
  Pmax:
  - 100.0
  - bar
  coeffs: []
