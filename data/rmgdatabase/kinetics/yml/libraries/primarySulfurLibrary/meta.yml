long_description: "\nThis library includes important sulfur-related reactions.\nPrepared\
  \ by Alon Grinberg Dana\n\nThis library consists of the following subsets:\n* SOx\n\
  * COS\n* HxSy\n* CxHySz\n* C-S\n* HOSO2 + O2 surface\n\nUsing this library as is\
  \ requires that N2 will be present in the RMG input file (even as a nonreactive\
  \ species) since N2\nis defined as a specific third body collider in the `SO2 +\
  \ O (+N2) <=> SO3 (+N2)` reaction.\n\nReference legend:\n[Baulch1992a] D.L. Baulch,\
  \ C.J. Cobos, R.A. Cox, C. Esser, P. Frank, Th. Just, J.A. Kerr, M.J. Philling,\
