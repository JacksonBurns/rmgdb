short_description: CF2BrCl
long_description: "\nExperimental and Chemical Kinetics Study of the Effects of Halon\
  \ 1211 (CF2BrCl) on the Laminar Flame Speed and Ignition of Light Hydrocarbons\n\
  \nOlivier Mathieu, Charles Keesee, Claire Gregoire, and Eric L. Petersen\nThe Journal\
  \ of Physical Chemistry A 2015 119 (28), 7611-7626\nDOI: 10.1021/acs.jpca.5b00959\n\
  (https://pubs.acs.org/doi/10.1021/acs.jpca.5b00959)\n\nAbstract\nIn this study,\
  \ the effect of Halon 1211 (CF2BrCl) on the ignition delay time and laminar flame\
  \ speed of CH4, C2H4, and C3H8\nwere investigated experimentally for the first time.\
  \ The results showed that the effects of Halon 1211 on the ignition delay time \n\
  are strongly dependent on the hydrocarbon: the ignition delay time of CH4 is significantly\
  \ decreased by Halon 1211 addition, \nwhile a significant increase in the ignition\
  \ delay time was observed with C2H4 for the lowest temperatures investigated. \n\
  Ignition delay times for C3H8 were slightly increased, mostly on the low-temperature\
  \ side and for the fuel-rich case. \nA significant reduction in the laminar flame\
  \ speed was observed for all of the fuels. \nA tentative chemical kinetics model\
  \ was assembled from existing models and completed with reactions that have been\
  \ determined in the \nliterature or estimated when necessary. The experimental results\
  \ were reproduced satisfactorily by the model, \nand a chemical analysis showed\
  \ that most of the effects of Halon 1211 on the ignition delay times of C2H4 and\
  \ C3H8 are due to the \nconsumption of H radical through the reaction HBr + H ?\
  \ Br + H2. In the case of methane, \n the CF2 radical promotes the formation of\
  \ H via CF2 + CH3 -> CH2:CF2 + H, \nwhich then promotes the branching reaction H\
  \ + O2 -> OH + O.\nThe laminar flame speed results can be explained using catalytic\
  \ cycles involving Br atoms that are similar to those reported in the literature\
  \ for CF3Br. \nThis study exhibits the need for a better estimation of the chlorine\
  \ atom chemistry during the combustion of hydrocarbons in the presence of fire suppressants.\n"
