short_description: All calculations were performed both at the G2MP2* levels of theory.
  The rate coefficients of the backward reactions were determined through thermodynamic
  consistence.
long_description: "\nKinetics from:\nThe Peculiar Kinetics of the Reaction between\
  \ Acetylene and the Cyclopentadienyl Radical \nSimone Fascella, Carlo Cavallotti,*\
  \ Renato Rota,* and Sergio Carra`\nPolitecnico di Milano, Dipartimento di Chimica,\
  \ Materiali e Ingegneria Chimica G. Natta / CIIRCO\nJ. Phys. Chem. A 2005, 109,\
  \ 7546-7557\na Kinetic parameters are reported in units consistent with kcal, s,\
  \ mol, and cm.\n\n"
