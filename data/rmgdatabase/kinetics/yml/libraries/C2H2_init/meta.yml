short_description: Initiation reactions in acetylene pyrolysis
long_description: "\nInitiation reactions which are important in acetylene pyrolysis,\
  \ reported by Zador et al.\nSpecies selected from PES's reported by Cremer et al.\
  \ and Mebel et al.\nElectronic structure calculations done using CCSD(T)-F12b/cc-pVQZ-F12//M06-2X/MG3S\n\
  Pressure dependent rate calculations done using MESS with 1D hindered rotors and\
  \ asymmetric Eckart tunneling\nRate coefficients fitted using MESS-TPfit code\n\n\
  Cremer, D.; Kraka, E.; Joo, H.; Stearns, J. A.; Zwier, T. S. Phys. Chem. Chem. Phys.\
  \ 2006, 8 (45), 5304.\nMebel, A. M.; Kislov, V. V.; Kaiser, R. I. J. Chem. Phys.\
  \ 2006, 125 (13), 133113.\nZador, J.; Fellows, M. D.; Miller, J. A. J. Phys. Chem.\
  \ A 2017, 121 (22), 4203\u20134217.\n"
