  \ employing \neither the aug-cc-pvdz or aug-cc-pvtz basis set, adopted by [Glarborg2021]\
  \ and calculated the relative third-body \nefficiencies of Ar, O2, and NH3 and selected\
  \ other collision partners compared to N2 for the reaction. \nPreviously taken from\
  \ [Lin2014b] as the reverse reaction: \"N2H4 <=> NH2 + NH2\"\nPart of the \"N2H4\
  \ + N2O4\" subset p. 264 Bath gas: Ar calculations done at the RCCSD(T)/6-311+G(3df,2p)//B3LYP/6-311G(d,p)\
