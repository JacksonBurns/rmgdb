label: C2H5ONO <=> CH3CHO + HNO
degeneracy: 1.0
short_description: estimated by alongd
long_description: "\nThis is the RTS reaction from [Green2014]\n\nHere, the rate was\
  \ estimated as follows:\n\nThe A factor is taken from the reaction C2H5ONO <=> C2H5O\
  \ + NO\nThe latter is given in reverse in the Nitrogen_Glarborg_Zhang_et_al library:\n\
  \    entry(\n        label = \"CH3CH2O + NO <=> CH3CH2ONO\",\n        degeneracy\
  \ = 1,\n        kinetics = Troe(\n            arrheniusHigh = Arrhenius(A=(1.2e+13,\
  \ 'cm^3/(mol*s)'), n=0, Ea=(-143, 'cal/mol'), T0=(1, 'K')),\n            arrheniusLow\
  \ = Arrhenius(A=(9.43e+19, 'cm^6/(mol^2*s)'), n=0, Ea=(0, 'cal/mol'), T0=(1, 'K')),\n\
  \            alpha = 0.6,\n            T3 = (1e-30, 'K'),\n            T1 = (1e+30,\
  \ 'K'),\n            T2 = (1e+30, 'K'),\n            efficiencies = {},\n      \
  \  ),\n    )\nReversing the high-P limit rate of this reaction using thermo for\
  \ CH3CH2O from FFCM-1, NO from NitrogenCurran,\nand CH3CH2ONO from NitrogenCurran\
  \ gives in 300-2000 K:\nK(T) = 9.85E+15 * exp(46 kcal/mol / RT)  s^-1   (negative\
  \ Ea)\nA = 9.85E+15 s^-1\n\nThe Ea is taken as the bond energy of C2H5O-NO\nEa =\
  \ H(NO) + H(C2H5O) - H(CH3CH2ONO)     (values taken at 1000 K)\nEa = 26.93 + 14.52\
  \ - (-0.31) = 41.76 kcal/mol\n\nThis is in agreement with the rate reported by [Green2014]\
  \ (probably estimated similarly)::\nK(T) = 1.0E+16 * exp(-42 kcal/mol / RT)  s^-1\n"
elementary_high_p: true
kinetics:
  type: Arrhenius
