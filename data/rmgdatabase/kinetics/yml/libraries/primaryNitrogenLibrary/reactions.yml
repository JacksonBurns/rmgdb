  \ level of theory\n+UCCSD(T)/cc-pVTZ rovibrational analysis with UCCSD-(T)/CBS(aug-cc-pVQZ\u2032\
  ,aug-cc-pV5Z\u2032) energies,\nCCSDT(Q)/cc-pVDZ higher order corrections, CCSD(T,full)/CBS-(TZ,QZ)\
  \ core\u2212valence corrections,\nCI/aug-cc-pcVTZ relativistic corrections, HF/cc-pVTZ\
  \ diagonal Born\u2212Oppenheimer corrections,\nand B3LYP/6-311++G(d,p) anharmonic\
  \ ZPE corrections\n"
