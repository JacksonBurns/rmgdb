long_description: "\nT range: 1100-2500 K, computed for Ar as bath gas\n\nAlso available\
  \ from [Glarborg2021]:\nReaction 3, Table 2 taken form [Glarborg2021]. Experimental\
  \ work re-interpreted using direct measurements from \n[Altinay&Macdonald2015].\
  \ Original values taken from [Klippenstein2009a], computed with the CCSD(T) method\
  \ employing \neither the aug-cc-pvdz or aug-cc-pvtz basis set, adopted by [Glarborg2021]\
  \ and calculated the relative third-body \nefficiencies of Ar, O2, and NH3 and selected\
  \ other collision partners compared to N2 for the reaction. \nPreviously taken from\
  \ [Lin2014b] as the reverse reaction: \"N2H4 <=> NH2 + NH2\"\nPart of the \"N2H4\
  \ + N2O4\" subset p. 264 Bath gas: Ar calculations done at the RCCSD(T)/6-311+G(3df,2p)//B3LYP/6-311G(d,p)\
  \ \nlevel of theory Only High Pressure Limit rate was taken; low limit and 1 atm\
  \ rate are also available from the same source\nAlso available from [Klippenstein2009a]:\
  \ \n    label = \"NH2 + NH2 <=> N2H4\",\n     kinetics = Troe(\n       arrheniusHigh\
  \ = Arrhenius(A=(9.33e-10, 'cm^3/(mol*s)'), n=-0.414, Ea=(66, 'cal/mol'), T0=(1,\
  \ 'K'), Tmin=(300, 'K'), \n       Tmax=(2500, 'K')), \n       arrheniusLow = Arrhenius(A=(2.7e+10,\
  \ 'cm^6/(mol^2*s)'), n=-5.49, Ea=(1987, 'cal/mol'), T0=(1, 'K'), Tmin=(300, 'K')\n\
  \       , Tmax=(2500, 'K')),\n       alpha=0.31, T3=(1e-30, 'K'), T1=(1e+30, 'K'),\
  \ efficiencies={}),\nTable 3, p. 10245, T range: 300-2500 K, calculated at the CCSD(T)\
  \ and CAS+1+2+QC level\n"
