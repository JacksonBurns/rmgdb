label: CH + N2 <=> NCN + H
degeneracy: 1.0
short_description: '[Lin2013b]'
long_description: "\nPart of the \"Prompt NO\" mechanism. This is the MAIN Prompt\
  \ NO reaction\ncalculated at the CCSD(T)/CBS//B3LYP/6-311++G(3df,2p) level of theory\n\
  k_A&B on p. 5782\nT range: 800-4000 K, 1 atm\nThis mechanism was first suggested\
  \ by Fenimore in 1971 (C.P. Fenimore, Symposium (International) on Combustion 13(1)\
  \ 1971, 373-380)\nHe found that 'post-flame' NO profiles extrapolated to zero at\
  \ the burner surface\nfor H2 and CO flames, but had non-zero intercepts in all the\
  \ hydrocarbon flames.\nHe named it `prompt NO`, since it was apparently formed in\
  \ the primary reaction zones of the hydrocarbon flames.\nHe suggested that this\
  \ prompt NO was due to the reaction of molecular nitrogen with a hydrocarbon free\
  \ radical,\nthe products of which were rapidly oxidized to NO.\nThe well-known thermal\
  \ (Zeldovich) NO mechanism was felt to be too slow to account for the non-zero intercepts.\n\
  Fenimore suggested the following reactions:\nCH+N2=HCN+N\nC2+N2=CN+CN\nAlthough\
  \ criticized, the idea gained acceptance, and Miller and Bowman (J.A. Miller, C.T.\
  \ Bowman, Progress in Energy and Combustion Science, 15(4) 1989 287-338)\nthat the\
  \ only plausible candidate for the prompt-NO reaction was:\nCH+N2=HCN+N\nwith possibly\
  \ some contribution from:\nC+N2=CN+N\nat very high temperatures.\nThe problem with\
  \ CH+N2=HCN+N is that it does not conserve electron spin (CH's ground state is a\
  \ doublet).\nThe final piece to the puzzle has apparently been put into place by\
  \ Moskaleva and Lin (L.V Moskaleva, M.C. Lin, Proceedings of the Combustion Institute\
  \ 28(2) 2000, 2393-2401),\nwho realized that the only way that everyone could be\
  \ correct was if there was another reaction path and a different set of products.\n\
  The cyanonitrene (NCN) radical was suggested as the product of this reaction.\n\
  In the end, it appears that Fenimore's prompt NO is due to a reaction between CH\
  \ and N2,\nas he suggested. However, the reaction does conserve electron spin, producing\
  \ NCN+H rather than HCN + N.\nMore info available in Miller & Troe 2005 (J.A. Miller,\
  \ M.J. Pillingb, J. Troe, Proceedings of the Combustion Institute 30(1) 2005, 43-88).\n\
  Also available from [Lin2000a]:\n    kinetics = Arrhenius(A=(2.22e+07, 'cm^3/(mol*s)'),\
  \ n=1.48, Ea=(23367, 'cal/mol'), T0=(1, 'K')),\nk3 in [Lin2000a], also first on\
  \ p. 2397, T range: 1500-4000 K, Done at the G2M(RCC2)//B3LYP/6-311G(d,p) level\
  \ of theory\nAlso available from [Miller2008]:\n    kinetics = Arrhenius(A=(4.10e+08,\
  \ 'cm^3/(mol*s)'), n=1.122, Ea=(17525, 'cal/mol'), T0=(1, 'K')),\ncalculated at\
  \ the CASPT2,CAS+1+2+QC,CCSD-(T)/aug-cc-pvtz levels of theory, T range: 400-3000\n\
  \nA rate for the NCN(S) <=> NCN(T) trnasition can be found in [Friedrichs2015]\n"
kinetics:
  type: Arrhenius
  A:
  - 2410000000.0
  - cm^3/(mol*s)
  n: 0.9
  Ea:
  - 17420.0
  - cal/mol
  T0:
  - 1.0
  - K
  Tmin:
  - 800.0
  - K
  Tmax:
  - 4000.0
  - K
