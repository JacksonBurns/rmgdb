  \ calculated the relative third-body \nefficiencies of Ar, O2, and NH3 and selected\
  \ other collision partners compared to N2 for the reaction.  The interaction \n\
  potentials were trained against large data sets of ab initio (counterpoise corrected\
  \ MP2 with cc-pVTZ and cc-pVQZ \ncomplete basis set extrapolations) energies. [Altinay&Macdonald2015]\
  \ indicate that the reaction is sufficiently fast at \na pressure of 560 Torr and\
  \ should be taken into account. Previously taken from [Hanson1984c] it's part of\
  \ the \"NHx\" \nsubset R1 in Table 1, p. 521 T range: 2200-2800 K Shock Tube. The\
