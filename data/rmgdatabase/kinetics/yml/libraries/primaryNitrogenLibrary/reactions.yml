  - 9850000000000000.0
  - s^-1
  n: 0.0
  Ea:
  - 41760.0
  - cal/mol
  T0:
  - 1.0
  - K
  Tmin:
  - 300.0
  - K
  Tmax:
  - 2000.0
  - K
