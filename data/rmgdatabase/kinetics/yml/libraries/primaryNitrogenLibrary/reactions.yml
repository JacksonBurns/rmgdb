  \ rate are also available from the same source\nAlso available from [Klippenstein2009a]:\
  \ \n    label = \"NH2 + NH2 <=> N2H4\",\n     kinetics = Troe(\n       arrheniusHigh\
  \ = Arrhenius(A=(9.33e-10, 'cm^3/(mol*s)'), n=-0.414, Ea=(66, 'cal/mol'), T0=(1,\
  \ 'K'), Tmin=(300, 'K'), \n       Tmax=(2500, 'K')), \n       arrheniusLow = Arrhenius(A=(2.7e+10,\
