short_description: primaryNitrogenLibrary
long_description: "\nThis library includes important nitrogen related reactions.\n\
  Prepared by Alon Grinberg Dana\n\nNotes:\n- Consider setting maximumRadicalElectrons\
  \ = 3 to allow [N] quartet if you're interested in NOx (also allow N2 to be reactive)\n\
  - For NOx, the Nitrogen_Dean_and_Bozzelli library should be used conjointly with\
  \ this one.\n- It is reccomended to consider the SOxNOx, NitrogenCurran, SulfurLibrary,\
  \ thermo_DFT_CCSDTF12_BAC, primaryThermoLibrary,\n  CHN, CHON, and BurcatNS thermo\
  \ libraries for your model generation (in this order)\n- Some reactions have different\
  \ kinetics coefficients reported for different T range,\n  'The Low T' rate is reported\
  \ in the comments. You can also use the \"primaryNitrogenLibrary/LowT\" sub-library,\
  \ and give it priority over this library\n- This library should be used along with\
  \ a library which handles well the transition of ground/excited states of small\
  \ radicals (e.g., FFCM)\n- At present (when this library was written) RMG does not\
  \ differentiate between cis and trans conformers.\n  When data was available seperately\
  \ for the production or consumption of two conformers\n  (e.g.: 'A + B <=> cis-X\
  \ + C' and 'A + B <=> trans-X + C')\n  the two rates were summed and reported in\
  \ this library as a duplicate reaction (using MultiArrhenius, unless otherwise mentioned).\n\
  \  Such instances are marked with the comment 'conformer-dup'.\n- Some excited species\
  \ were combined with their ground state in this library (e.g.: NCN, CH2NCN).\n\n\
  This library contains the following subsets:\n* Thermal NO\n* Prompt NO\n* N2O Pathway\n\
  * NNH Pathway\n* NHx Pathway\n* N2H4 + N2O4\n* CH3NO2\n* Thermal de-NOx\n* NO2 decomposition\n\
  * NOx\n* HCN\n* C1-oxygenates\n\nReference legend:\n[Baulch1992a] D.L. Baulch, C.J.\
