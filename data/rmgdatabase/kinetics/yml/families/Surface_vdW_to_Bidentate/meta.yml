short_description: ''
long_description: "\nIf a vdW adsorbate has an internal double or a triple bond, reduce\
  \ the bond order and make it bidentate. \n\n *1#*2                   *1==*2\n  \
  \ :            ---->     |  |\n ~*3~ + ~*4~~           ~*3~~*4~~\n\n\nThe rate,\
  \ which should be in mol/m2/s,\nwill be given by k * (mol/m2) * (mol/m2)\nso k should\
  \ be in (m2/mol/s)\n"
template:
  reactants:
  - Combined
  - VacantSite
  products:
  - Adsorbate
  ownReverse: false
recipe:
  actions:
  - - CHANGE_BOND
    - '*1'
    - 1
    - '*3'
  - - FORM_BOND
    - '*2'
    - 1
    - '*4'
  - - CHANGE_BOND
    - '*1'
    - -1
    - '*2'
reversible: true
reverse_map: {}
auto_generated: false
