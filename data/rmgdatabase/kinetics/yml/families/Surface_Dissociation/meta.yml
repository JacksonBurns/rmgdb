short_description: ''
long_description: "\nSurface bond fission of one species into two distinct adsorbates.\
  \ Atom *1 is bonded to the surface (*3). The image below shows a single bond, but\
  \ single, double, and triple are possible. What matters is that the bond between\
  \ *1 and *2 must be single.\n    # NOTE: we should probably include vdW, too!\n\n\
  \ *1--*2                 *1     *2\n  |            ---->    ||      |\n~*3~ + ~*4~~\
  \           ~*3~ + ~*4~~\n\n\nThe rate, which should be in mol/m2/s,\nwill be given\
  \ by k * (mol/m2) * (mol/m2)\nso k should be in (m2/mol/s)\n"
template:
  reactants:
  - Combined
  - VacantSite
  products:
  - Adsorbate1
  - Adsorbate2
  ownReverse: false
recipe:
  actions:
  - - FORM_BOND
    - '*2'
    - 1
    - '*4'
  - - CHANGE_BOND
    - '*1'
    - 1
    - '*3'
  - - BREAK_BOND
    - '*1'
    - 1
    - '*2'
reversible: true
reactant_num: 2
product_num: 2
auto_generated: false
