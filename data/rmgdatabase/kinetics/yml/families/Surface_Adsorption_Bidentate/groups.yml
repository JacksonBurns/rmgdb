---
label: chargedSurface1
group: |2

  1 *1 R!H u0 c-1 {2,T}
  2 *2 R!H u0 c+1 {1,T}
forbidden: true
short_description: ''
long_description: "\nThe adsorbing molecule should not have a charge on the surface.\
  \ \nI've written it specifically for the case of CO adsorption for now.\n\ne.g.\
  \ this is not allowed:\n\n-C#O+    -->  -C=O+\n               | |\n X X        \
  \   X X\n"
