short_description: ''
long_description: "\nBidentate adsorption of a gas-phase species onto the surface.\
  \ \nThe multiple-bond in the gas-phase species is decrease; \nthe atoms at either\
  \ end are each singled bonded to the surface.\n\n *1=*2                *1-*2\n \
  \            ---->    |   |\n~*3~ + ~*4~         ~*3~ *4~~\n\nNote that it does\
  \ not form a bond between *3 and *4.\n\nThe rate, which should be in mol/m2/s,\n\
  will be given by k * (mol/m2) * (mol/m2) * (mol/m3)\nso k should be in (m5/mol2/s).\
  \ We will use sticking coefficients.\n"
template:
  reactants:
  - Adsorbate
  - VacantSite1
  - VacantSite2
  products:
  - Adsorbed
  ownReverse: false
recipe:
  actions:
  - - CHANGE_BOND
    - '*1'
    - -1
    - '*2'
  - - FORM_BOND
    - '*1'
    - 1
    - '*3'
  - - FORM_BOND
    - '*2'
    - 1
    - '*4'
reversible: true
auto_generated: false
