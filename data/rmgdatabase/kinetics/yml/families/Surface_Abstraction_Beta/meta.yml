short_description: ''
long_description: "\nSurface abstraction of one atom to another adsorbate. The bond\
  \ fission occurs not at the binding atom, but in the beta position of the adsorbate,\
  \ that is the bond between Atom *2 and *3 is broken. Atom *1 is bonded to the surface\
  \ (*5). The bond order between *1/*3 and the surface decreases. An example for this\
  \ reaction is: COH* + CH2* = CO* + CH3*. The bond between *2 and *3 must be single.\n\
  \n\n *1-*2--*3  *4             *1=*2   *3-*4\n  ||        ||      ---->   |    \
  \   |\n~*5~ +    ~*6~~           ~*5~ +  ~*6~~\n\nThe rate, which should be in mol/m2/s,\n\
  will be given by k * (mol/m2) * (mol/m2)\nso k should be in (m2/mol/s). \n"
template:
  reactants:
  - Donating
  - Abstracting
  products:
  - Adsorbate2
  - Adsorbate3
  ownReverse: false
