short_description: ''
long_description: "\nIf a monodentate adsorbate has an internal double or triple bond,\
  \ then it can fall over onto a vacant site, creating a bidentate.\n\n *1=*2    \
  \                *1--*2  \n  |              ---->    ||   |     \n~*3~ + ~*4~~ \
  \            ~*3~~*4~~ \n\nThe rate, which should be in mol/m2/s,\nwill be given\
  \ by k * (mol/m2) * (mol/m2)\nso k should be in (m2/mol/s)\n"
template:
  reactants:
  - Monodentate
  - VacantSite
  products:
  - Bidentate
  ownReverse: false
recipe:
  actions:
  - - FORM_BOND
    - '*2'
    - 1
    - '*4'
  - - CHANGE_BOND
    - '*1'
    - -1
    - '*2'
  - - CHANGE_BOND
    - '*1'
    - 1
    - '*3'
reversible: true
auto_generated: false
