---
label: adjacentradical
group: |2

  1 *1 R u1 {2,S}
  2    R u1 {1,S}
forbidden: true
short_description: ''
long_description: |2

  The adsorbing atom should not be adjacent to a radical.
  e.g. this is not allowed:

  .O-O.    -->   .O-O
                    |
     X              X
