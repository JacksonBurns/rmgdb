---
label: adjacentradical
group: "\n1 *1 R u1 {2,S}\n2    R u1 {1,S}\n"
forbidden: true
short_description: ''
long_description: "\nThe adsorbing atom should not be adjacent to a radical.\ne.g.\
  \ this is not allowed:\n\n.O-O.    -->   .O-O\n                  |\n   X       \
  \       X\n"
