long_description: "\nIf a monodentate adsorbate bound through oxygen with a single\
  \ bond has\ndouble bond to another oxygen in the beta position, the adsorbate can\
  \ fall\nover into a resonant vdW bidentate configuration.\n\n *1-*2=*3         \
  \        *1-*2=*3  \n  |              ---->     |     :     \n~*4~ + ~*5~~     \
  \        ~*4~~~~*5~~ \n\nThe rate, which should be in mol/m2/s,\nwill be given by\
  \ k * (mol/m2) * (mol/m2)\nso k should be in (m2/mol/s)\n"
