  \ to the surface (*4). The bond between *2 and *3 must be single.\n\n\n *1-*2--*3\
  \              *1=*2  *3\n  |             ---->    :      |\n~*4~ + ~*5~~      \
  \     ~*4~ + ~*5~~\n\nThe rate should be in mol/m2/s, so k should be in (m2/mol/s).\
  \ \n"
