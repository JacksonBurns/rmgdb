label: H_shift_to_double_resonant_radical_CPD
group: "\n1 *1 C   u0 {2,S} {5,[S,D]} {6,S}\n2 *2 C   u0 {1,S} {3,[D,T]}\n3 *3 C \
  \  u0 {2,[D,T]} {4,[S,D]}\n4 *4 C   u0 {3,[S,D]} {5,[D,T]}\n5 *5 C   u0 {1,[S,D]}\
  \ {4,[D,T]} {7,S}\n6 *6 H   u0 {1,S}\n7    R!H u1 {5,S}\n"
forbidden: true
short_description: ''
long_description: "\nForbid an H from shifting to a doubly resonant radical site on\
  \ a CPD ring,\nin order to avoid redundancy with Intra_H_migration family, the radical\
  \ atom can be anything element\n"
