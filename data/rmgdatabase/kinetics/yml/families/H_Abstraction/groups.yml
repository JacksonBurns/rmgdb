long_description: ''
---
label: disprop6_mul_bonds
group: "\n1 *1 R u0 {2,[D,T]} {3,S}\n2    R u1 {1,[D,T]}\n3 *2 H u0 {1,S}\n"
forbidden: true
short_description: ''
long_description: "\nForbidding cases such as:\nR + [HC]=CH2 <=> RH + [CH]=[CH]\n\
  R + [C]#CH <=> RH + [C]#[C]\nR + [N]=NH <=> RH + [N]=[N]\n"
---
label: disprop7_birad
group: "\n1 *1 R     u1 {2,S} {3,S}\n2    [C,N] u1 {1,S}\n3 *2 H     u0 {1,S}\n"
forbidden: true
short_description: ''
long_description: "\nForbidding cases such as:\nR + [NH][NH] <=> RH + [N][NH]\n"
