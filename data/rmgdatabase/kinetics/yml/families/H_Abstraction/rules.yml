label: X_H_or_Xrad_H_Xbirad_H_Xtrirad_H;Y_rad_birad_trirad_quadrad
short_description: Default
long_description: "\nIf a biradical CH2JJ can abstract from RCH4 to make RCH3J and\
  \ CH3J \nthen a Y_rad CH3J should be able to abstract from RCH3J which means X_H\
  \ needs \nto include Xrad_H. I.e. you can abstract from a radical. To make this\
  \ possible\na head node has been created X_H_or_Xrad_H which is a union of X_H and\
  \ Xrad_H.\nThe kinetics for it have just been copied from X_H and are only defined\
  \ for \nabstraction by Y_rad_birad. I.e. the top level very approximate guess.\n\
  \nDo better kinetics for this exist? Do we in fact use the reverse kinetics anyway?\n"
rank: 0
kinetics:
  type: ArrheniusEP
  A:
  - 100000
  - cm^3/(mol*s)
  n: 0
  alpha: 0
  E0:
  - 10
  - kcal/mol
  Tmin:
  - 300
  - K
  Tmax:
  - 1500
  - K
