short_description: ''
long_description: "\nSurface abstraction of the beta R!H-R atom of a vdW bidentate\
  \ by a neighboring surface adsorbate. \nExample:  [X]~OC(H)O[X] + O=[X]-> OCO.[X]\
  \ + O[X] + [X]\nThe bond fission occurs at the beta position: the R!H-H bond (*2-*4)\
  \ breaks, and *4 (R) \nis transferred to the abstracting adsorbate *7, which weakens\
  \ its own surface bond (*7-*8) upon \ngaining R. Simultaneously, the *1-*2 bond\
  \ (O-R) strengthens and *3 (O) detaches from surface \nsite *6, releasing CO2. A\
  \ vacant site (*6) is produced as a product.\n\n    *4\n     |\n *1-*2=*3      \
  \    *7            *1=*2=*3    *7-*4\n  |     :          ||      ---->         \
  \     |\n~*5~ +~*6~  +     ~*8~~           ~*5~  +   ~*8~~  + ~*6~\n\nThe rate,\
  \ which should be in mol/m2/s,\nwill be given by k * (mol/m2) * (mol/m2)\nso k should\
  \ be in (m2/mol/s). \n"
