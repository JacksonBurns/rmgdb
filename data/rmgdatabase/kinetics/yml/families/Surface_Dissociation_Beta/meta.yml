short_description: ''
long_description: "\nSurface bond fission of one species into two distinct adsorbates.\
  \ The bond fission occurs not at the binding atom, but in the beta position of the\
  \ adsorbate, that is the bond between Atom *2 and *3 is broken. Atom *1 binds to\
  \ the surface (*4). The image below shows a double bond, but a triple bond is also\
  \ possible. What matters is that the bond between *2 and *3 must be single.\n\n\n\
  \ *1-*2--*3              *1=*2  *3\n  ||            ---->    |      |\n~*4~ + ~*5~~\
  \           ~*4~ + ~*5~~\n\nThe rate, which should be in mol/m2/s, so k should be\
  \ in (m2/mol/s).\n"
template:
  reactants:
  - Combined
  - VacantSite
  products:
  - Adsorbate1
  - Adsorbate2
  ownReverse: false
recipe:
  actions:
  - - FORM_BOND
    - '*3'
    - 1
    - '*5'
  - - CHANGE_BOND
    - '*1'
    - -1
    - '*4'
  - - CHANGE_BOND
    - '*1'
    - 1
    - '*2'
  - - BREAK_BOND
    - '*2'
    - 1
    - '*3'
reversible: true
