---
label: C_quintet
group: "\n1 *3 C u4 p0 c0\n"
forbidden: true
short_description: ''
long_description: ''
---
label: disprop1_OS_rad
group: "\n1 *1 [C,N] u0 {2,S} {3,S}\n2    [O,S] u1 {1,S}\n3 *2 Br1s  u0 {1,S}\n"
forbidden: true
short_description: ''
long_description: "\nThis group forbids `H[C,N][O,S].`, where the radical site is\
  \ O or S, but the non-rad site isn't O or S.\n"
---
label: disprop1_base_case
group: "\n1 *1 R     u0 {2,S} {3,S}\n2    [C,N] u1 {1,S}\n3 *2 Br1s  u0 {1,S}\n"
forbidden: true
short_description: ''
long_description: "\nGenerally, we'd like to forbid `HR[R.]` from reacting here (`.`\
  \ marks a radical), since this is a disprop reaction.\nHowever, the following specific\
  \ cases must not be forbidden here: `HO2`, `HSS`, `HOS`, `HSO`\n(since they form\
  \ the ground state triplets O2, S2, and SO).\nThis group forbids `HR[C,N].`, where\
  \ the radical site isn't O or S\n"
---
label: disprop1_hyperS_H
group: "\n1 *1 S     u0 p[0,1] {2,S} {3,S}\n2    [O,S] u1 {1,S}\n3 *2 Br1s  u0 {1,S}\n"
forbidden: true
short_description: ''
long_description: "\nThis group forbids `H[S p0,1][O,S].`, where hypervalance S is\
  \ allowed at the H site\n"
---
label: disprop1_hyperS_rad
group: "\n1 *1 [O,S] u0 {2,S} {3,S}\n2    S     u1 p[0,1] {1,S}\n3 *2 Br1s  u0 {1,S}\n"
forbidden: true
short_description: ''
long_description: "\nThis group forbids `H[O,S][S p0,1].`, where hypervalance S is\
  \ allowed at the rad site\n"
---
label: disprop2
group: "\n1    R    u0 {2,S} {3,D}\n2 *1 R    u0 {1,S} {4,S}\n3    R    u0 {1,D} {5,S}\n\
  4 *2 Br1s u0 {2,S}\n5    R    u1 {3,S}\n"
forbidden: true
short_description: ''
long_description: ''
---
label: disprop3
group: "\n1    R    u0 {2,S} {3,T}\n2 *1 R    u0 {1,S} {4,S}\n3    R    u0 {1,T} {5,S}\n\
  4 *2 Br1s u0 {2,S}\n5    R    u1 {3,S}\n"
forbidden: true
short_description: ''
long_description: ''
---
label: disprop4
group: "\n1    R    u0 {2,D} {3,S}\n2    R    u0 {1,D} {4,S}\n3    R    u0 {1,S} {5,D}\n\
  4 *1 R    u0 {2,S} {6,S}\n5    R    u0 {3,D} {7,S}\n6 *2 Br1s u0 {4,S}\n7    R \
  \   u1 {5,S}\n"
forbidden: true
short_description: ''
long_description: ''
---
label: disprop5
group: "\n1    R    u0 {2,D} {3,S}\n2    R    u0 {1,D} {4,S}\n3    R    u0 {1,S} {5,D}\n\
  4 *1 R    u0 {2,S} {6,S}\n5    R    u0 {3,D} {7,S}\n6 *2 Br1s u0 {4,S}\n7    R \
  \   u1 {5,S}\n"
forbidden: true
short_description: ''
long_description: ''
---
label: disprop6_mul_bonds
group: "\n1 *1 R    u0 {2,[D,T]} {3,S}\n2    R    u1 {1,[D,T]}\n3 *2 Br1s u0 {1,S}\n"
forbidden: true
short_description: ''
long_description: "\nForbidding cases such as:\nR + [HC]=CH2 <=> RH + [CH]=[CH]\n\
  R + [C]#CH <=> RH + [C]#[C]\nR + [N]=NH <=> RH + [N]=[N]\n"
---
label: disprop7_birad
group: "\n1 *1 R     u1 {2,S} {3,S}\n2    [C,N] u1 {1,S}\n3 *2 Br1s  u0 {1,S}\n"
forbidden: true
short_description: ''
long_description: "\nForbidding cases such as:\nR + [NH][NH] <=> RH + [N][NH]\n"
