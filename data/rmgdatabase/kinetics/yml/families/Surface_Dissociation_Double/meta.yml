long_description: "\nSurface bond fission of one species with a double bond into two\
  \ distinct adsorbates. Atom *1 binds to the surface (*3). The image below shows\
  \ a single bond, but double is also possible. What matters is that the bond between\
  \ *1 and *2 must be double.\n\n *1=*2                  *1     *2\n  |          \
  \   ---->   |||    ||\n~*3~ + ~*4~~           ~*3~ + ~*4~~\n\n\nThe rate, which\
  \ should be in mol/m2/s,\nwill be given by k * (mol/m2) * (mol/m2)\nso k should\
  \ be in (m2/mol/s)\n"
