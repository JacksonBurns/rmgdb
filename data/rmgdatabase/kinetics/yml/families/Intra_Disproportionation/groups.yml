---
label: R3
group: OR{R3radExo}
short_description: ''
long_description: "\nAaron Vandeputte notes:\nIt is assumed that the other radical\
  \ site (#3) is not a member of the TS ring; we may eventually want to consider the\
  \ possibility\nfor the radical site being in the TS ring, which in certain cases,\
  \ may give rise to multiple transition states for the same reaction; \nI expect\
  \ that the number of cases that would be encountered where this reaction would not\
  \ occur at all due to neglecting this would be small; \nUPDATE: 2,5-pentdiyl radical\
  \ to 1-pentene can only occur when radical site is included in ring, so maybe this\
  \ is more important than I thought\nUPDATE2: I will consider possibility of Endo\
  \ case, except for R3radEndo in which case the 2 rads are adjacent to each other,\
  \ but I will assume \nthe rate rules are the same as for the probably more typical\
  \ exo case (2nd radical site not a part of ring)\n"
children: []
