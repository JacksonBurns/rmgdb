---
label: adjacentradical1
group: "\n1 *1 R u0 {2,[S,D,T]}\n2    R u1 {1,[S,D,T]}\n"
forbidden: true
short_description: ''
long_description: "\nThe adsorbing atom should not be adjacent to a radical.\ne.g.\
  \ this is not allowed:\n\nCH2.-CH3    -->   CH2.-CH2   +   H\n                 \
  \      |         |\n     X X               X         X\n"
---
label: adjacentradical2
group: "\n1 *2 R u0 {2,[S,D,T]}\n2    R u1 {1,[S,D,T]}\n"
forbidden: true
short_description: ''
long_description: "\nNeither adsorbing atom should be adjacent to a radical\ne.g.\
  \ this is not allowed:\n\nCH2.-CH3    -->   CH2.-CH2   +   H\n                 \
  \      |         |\n     X X               X         X\n"
---
label: disigma1
group: "\n1 *1 R u0 {2,[S,D,T]}\n2    R u0 {1,[S,D,T]} {3,[S,D,T]}\n3    X u0 {2,[S,D,T]}\n"
forbidden: true
short_description: ''
long_description: "\nThe adsorbing atom should not be adjacent to an atom that is\
  \ already adsorbed.\ne.g. this is not allowed:\n\nH  O=C-O   <-->  O=CH-O\n|   \
  \ | |              |\nX    X X         X X  X\n"
---
label: disigma2
