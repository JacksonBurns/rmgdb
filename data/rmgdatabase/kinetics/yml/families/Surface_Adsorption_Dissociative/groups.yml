---
label: adjacentradical1
group: |2

  1 *1 R u0 {2,[S,D,T]}
  2    R u1 {1,[S,D,T]}
forbidden: true
short_description: ''
long_description: |2

  The adsorbing atom should not be adjacent to a radical.
  e.g. this is not allowed:

  CH2.-CH3    -->   CH2.-CH2   +   H
                         |         |
       X X               X         X
---
label: adjacentradical2
group: |2

  1 *2 R u0 {2,[S,D,T]}
  2    R u1 {1,[S,D,T]}
forbidden: true
short_description: ''
long_description: |2

  Neither adsorbing atom should be adjacent to a radical
  e.g. this is not allowed:

  CH2.-CH3    -->   CH2.-CH2   +   H
                         |         |
       X X               X         X
---
label: disigma1
group: |2

  1 *1 R u0 {2,[S,D,T]}
  2    R u0 {1,[S,D,T]} {3,[S,D,T]}
  3    X u0 {2,[S,D,T]}
forbidden: true
short_description: ''
long_description: |2

  The adsorbing atom should not be adjacent to an atom that is already adsorbed.
  e.g. this is not allowed:

  H  O=C-O   <-->  O=CH-O
  |    | |              |
  X    X X         X X  X
