long_description: "\nDissociative adsorption of a gas-phase species onto the surface.\
  \ The single-bond\nin the gas-phase species is split; the resulting fragments each\
  \ are singled\nbonded to the surface.\n\n *1-*2               *1      *2\n     \
  \        ---->    |       |\n~*3~ + ~*4~         ~*3~~ + ~*4~~\n\nThe rate, which\
  \ should be in mol/m2/s,\nwill be given by k * (mol/m2) * (mol/m2) * (mol/m3)\n\
  so k should be in (m5/mol2/s). We will use sticking coefficients.\n\nFor now, so\
  \ there aren't duplicate reactions, the heavy atom will match *1\n"
