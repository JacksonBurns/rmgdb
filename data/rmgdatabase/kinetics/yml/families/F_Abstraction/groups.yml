group: "\n1 *1 R     u0 {2,S} {3,S}\n2    [C,N] u1 {1,S}\n3 *2 F1s   u0 {1,S}\n"
forbidden: true
short_description: ''
long_description: "\nGenerally, we'd like to forbid `HR[R.]` from reacting here (`.`\
  \ marks a radical), since this is a disprop reaction.\nHowever, the following specific\
  \ cases must not be forbidden here: `HO2`, `HSS`, `HOS`, `HSO`\n(since they form\
  \ the ground state triplets O2, S2, and SO).\nThis group forbids `HR[C,N].`, where\
  \ the radical site isn't O or S\n"
