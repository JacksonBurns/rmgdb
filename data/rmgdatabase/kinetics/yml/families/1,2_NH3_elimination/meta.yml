short_description: ''
long_description: '

  This family describes reactions on a singlet PES of the sort:


  NNHNH2 <=> N=N + NH3


  where a terminal NH2 group and an H atom on an adjacent N are eliminated as NH3,
  leaving a multiple bond.


  atom labeling:

  *1 - the eliminated N

  *2 - N adjacent to N *1, has the eliminated H *4

  *3 - N adjacent to N *2

  *4 - the eliminated H from N *2

  '
template:
  reactants:
  - NNHNH2
  products:
  - NN
  - NH3
  ownReverse: false
recipe:
  actions:
  - - FORM_BOND
    - '*1'
    - 1
    - '*4'
  - - BREAK_BOND
    - '*1'
    - 1
    - '*2'
  - - BREAK_BOND
    - '*2'
    - 1
    - '*4'
  - - GAIN_PAIR
    - '*2'
    - '1'
  - - LOSE_PAIR
    - '*3'
    - '1'
  - - CHANGE_BOND
    - '*2'
    - 1
    - '*3'
reversible: true
reverse_map: {}
auto_generated: false
