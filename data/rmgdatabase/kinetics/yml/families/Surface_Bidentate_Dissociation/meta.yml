short_description: ''
long_description: "\nA bidentate species with a single bond dissociates. The reverse\
  \ reaction is when two adsorbates, each with double-bonds or higher to the surface,\
  \ come together and form a single bond between them (thereby reducing the bond orders\
  \ to the surface).\n\n *1--*2             *1   +  *2\n  |  |     ---->    ||   \
  \    ||\n~*3~~*4~~          ~*3~~ +  ~*4~~ \n\nThe rate, which should be in mol/m2/s,\n\
  will be given by k * (mol/m2)\nso k should be in (1/s)\n"
